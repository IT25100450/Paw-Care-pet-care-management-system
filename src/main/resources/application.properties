spring.application.name=Paw care

# Server Configuration
server.port=8080

# MS SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PawCare;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=viharaa2006
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
