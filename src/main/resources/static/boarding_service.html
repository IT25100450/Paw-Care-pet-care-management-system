<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auth-guard.js"></script>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawCare – Reserve a Boarding Kennel</title>
  <meta name="description" content="Reserve a kennel for your pet at PawCare's boarding facility." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .booking-page { max-width: 760px; margin: 3rem auto; padding: 2rem; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
    .booking-page h2 { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 1.6rem; }
    .form-group { margin-bottom: 1.3rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: .85rem; font-weight: 600; color: var(--text-secondary); }
    .form-input { padding: 0.8rem 1rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-family:'Inter',sans-serif; font-size: .9rem; outline: none; transition: border-color var(--transition); width: 100%; box-sizing: border-box; }
    .form-input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(34,197,94,.1); }
    .form-input[readonly] { opacity: 0.6; cursor: not-allowed; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-submit { width: 100%; padding: 1rem; background: var(--green-gradient); color: #fff; border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 1rem; cursor: pointer; font-family:'Inter',sans-serif; transition: all 0.3s; margin-top: .5rem; }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .alert-msg { padding: 1rem 1.2rem; margin-bottom: 1.2rem; border-radius: var(--radius-sm); display: none; font-size: .9rem; }
    .alert-msg.success { display: block; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,.3); color: var(--green-300); }
    .alert-msg.error   { display: block; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
    .section-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin: 1.5rem 0 .8rem; border-top: 1px solid var(--border); padding-top: 1.2rem; }
    .info-banner { background: rgba(34,197,94,.05); border: 1px solid rgba(34,197,94,.15); border-radius: var(--radius-sm); padding: .8rem 1rem; font-size: .82rem; color: var(--text-secondary); margin-bottom: 1.4rem; display: flex; gap: .6rem; align-items: center; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><div class="paw-logo">🐾</div><span class="brand-name">PawCare</span></div>
  <div class="nav-links"></div>
</nav>

<div class="booking-page">
  <h2>🏠 Reserve a Boarding Kennel</h2>

  <div class="info-banner">
    ℹ️ Your pet will be in safe hands. Clean kennels, 24/7 monitoring, and custom feeding schedules.
  </div>

  <div id="status-msg" class="alert-msg"></div>

  <form id="boarding-form" autocomplete="off">
    <!-- Pet Selection -->
    <div class="form-group">
      <label for="pet-select">Select Your Pet *</label>
      <select id="pet-select" class="form-input" required>
        <option value="" disabled selected>Loading your pets…</option>
      </select>
    </div>

    <!-- Dates -->
    <div class="form-grid-2">
      <div class="form-group">
        <label for="checkin-date">Check-In Date *</label>
        <input type="date" id="checkin-date" class="form-input" required />
      </div>
      <div class="form-group">
        <label for="checkout-date">Check-Out Date *</label>
        <input type="date" id="checkout-date" class="form-input" required />
      </div>
    </div>

    <p class="section-label" style="color:var(--text-muted);font-weight:500;">A kennel will be assigned by our Boarding team when your booking is confirmed.</p>

    <button type="submit" class="btn-submit" id="submit-btn">🏠 Request Boarding</button>
  </form>
</div>

<footer class="footer">
  <div class="footer-brand"><span class="footer-logo">🐾 PawCare</span><span class="footer-tagline">Caring for your pets, always.</span></div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const statusMsg = document.getElementById('status-msg');

  // Set min date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('checkin-date').min = today;
  document.getElementById('checkout-date').min = today;

  // Enforce checkout >= checkin
  document.getElementById('checkin-date').addEventListener('change', () => {
    document.getElementById('checkout-date').min = document.getElementById('checkin-date').value;
  });

  // Load user's pets
  const userStr = localStorage.getItem('pawcare_user');
  if (!userStr) { window.location.href = 'login.html'; return; }
  const user = JSON.parse(userStr);

  try {
    const res = await fetch(`/api/pets/by-email?email=${encodeURIComponent(user.email)}`);
    const pets = await res.json();
    const select = document.getElementById('pet-select');

    if (!pets || pets.length === 0) {
      select.innerHTML = '<option value="" disabled selected>No pets registered yet</option>';
      statusMsg.className = 'alert-msg error';
      statusMsg.textContent = '⚠️ You have no registered pets. Please add a pet to your profile first.';
      return;
    }

    select.innerHTML = '<option value="" disabled selected>Select a pet…</option>';
    pets.forEach(pet => {
      const opt = document.createElement('option');
      opt.value = pet.petId;
      opt.textContent = `${pet.name} (${pet.specieName || 'Unknown'})`;
      select.appendChild(opt);
    });
  } catch (e) {
    console.error('Failed to load pets', e);
    statusMsg.className = 'alert-msg error';
    statusMsg.textContent = '❌ Failed to load your pets. Please try refreshing.';
  }

  // Form submit
  document.getElementById('boarding-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const petId = document.getElementById('pet-select').value;
    const checkinDate = document.getElementById('checkin-date').value;
    const checkoutDate = document.getElementById('checkout-date').value;

    if (!petId || !checkinDate || !checkoutDate) {
      statusMsg.className = 'alert-msg error';
      statusMsg.textContent = '⚠️ Please fill in all required fields.';
      return;
    }

    if (checkoutDate <= checkinDate) {
      statusMsg.className = 'alert-msg error';
      statusMsg.textContent = '⚠️ Check-out date must be after check-in date.';
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Reserving…';

    const payload = {
      ownerId: user.ownerId,
      petId: parseInt(petId),
      bookingDateTime: checkinDate + 'T08:00:00',
      checkoutDate: checkoutDate
    };

    try {
      const res = await fetch('/api/bookings/boarding', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (res.ok) {
        statusMsg.className = 'alert-msg success';
        statusMsg.textContent = `✅ Boarding requested! Booking #${data.bookingId} (Check-in: ${checkinDate}, Check-out: ${checkoutDate}) is pending — a kennel will be assigned on confirmation.`;
        e.target.reset();
        // Reset pet dropdown
        document.getElementById('checkin-date').min = today;
      } else {
        statusMsg.className = 'alert-msg error';
        statusMsg.textContent = '❌ ' + (data.error || 'Unknown error');
      }
    } catch (err) {
      statusMsg.className = 'alert-msg error';
      statusMsg.textContent = '❌ Network error. Please try again.';
    }

    btn.disabled = false;
    btn.textContent = '🏠 Request Boarding';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>

<script src="nav-manager.js"></script>
</body>
</html>
