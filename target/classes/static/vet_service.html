<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawCare – Vet Service (Staff)</title>
  <meta name="description" content="Staff interface to log veterinary checkup records, diagnoses, and vaccination dates." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .staff-page { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .staff-header { margin-bottom: 2rem; }
    .staff-header h1 { font-size: 1.6rem; font-weight: 800; color: var(--text-primary); }
    .staff-header p { font-size: .88rem; color: var(--text-secondary); margin-top: .3rem; }
    .staff-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .staff-form-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; }
    .staff-form-panel h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 1.5rem; display: flex; align-items: center; gap: .5rem; }
    .staff-table-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; overflow-x: auto; }
    .staff-table-panel h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: .3rem; }
    .form-group label { font-size: .82rem; font-weight: 600; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: .7rem .9rem; color: var(--text-primary); font-family: 'Inter',sans-serif; font-size: .88rem;
      outline: none; transition: border-color var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--border-active); box-shadow: 0 0 0 3px rgba(34,197,94,.1); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-submit-row { margin-top: 1.2rem; display: flex; gap: .8rem; }
    .vet-alert { padding: .7rem 1rem; border-radius: var(--radius-sm); font-size: .82rem; display: none; margin-bottom: 1rem; }
    .vet-alert.visible { display: block; background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.2); color: var(--green-300); }
    .vet-alert.error { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.2); color: #f87171; }
    .btn-icon-sm { background: none; border: none; cursor: pointer; font-size: 1rem; padding: .2rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand"><div class="paw-logo">🐾</div><span class="brand-name">PawCare</span></div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Home</a>
    <a href="booking_main.html" class="nav-link">Book Service</a>
    <a href="vet_main.html" class="nav-link active">Veterinary</a>
    <a href="store_main.html" class="nav-link">Pet Store</a>
  </div>
  <div class="nav-user"><div class="user-avatar admin-av">VET</div><span class="user-name">Vet Staff</span></div>
</nav>

<div class="staff-page">
  <div class="staff-header">
    <h1>🩺 Log Medical Record</h1>
    <p>Record post-checkup details — diagnoses, treatments, and vaccinations</p>
  </div>

  <div class="vet-alert" id="vet-alert"></div>

  <div class="staff-layout">
    <!-- Form Panel -->
    <div class="staff-form-panel">
      <h2>📝 New Record</h2>
      <form id="vet-record-form" autocomplete="off">
        <div class="form-grid">
          <div class="form-group">
            <label for="vet-owner-email">Owner Email *</label>
            <input type="email" id="vet-owner-email" placeholder="owner@email.com" required />
          </div>
          <div class="form-group">
            <label for="vet-pet-name">Pet Name *</label>
            <input type="text" id="vet-pet-name" placeholder="Buddy" required />
          </div>
        </div>
        <div class="form-grid full" style="margin-top:1rem;">
          <div class="form-group">
            <label for="vet-diagnosis">Diagnosis *</label>
            <textarea id="vet-diagnosis" placeholder="Describe the diagnosis…" required></textarea>
          </div>
        </div>
        <div class="form-grid full" style="margin-top:1rem;">
          <div class="form-group">
            <label for="vet-treatment">Treatment</label>
            <textarea id="vet-treatment" placeholder="Prescribed treatment…"></textarea>
          </div>
        </div>
        <div class="form-grid" style="margin-top:1rem;">
          <div class="form-group">
            <label for="vet-vac-date">Vaccination Date</label>
            <input type="date" id="vet-vac-date" />
          </div>
          <div class="form-group">
            <label for="vet-next-due">Next Due Date</label>
            <input type="date" id="vet-next-due" />
          </div>
        </div>
        <div class="form-grid" style="margin-top:1rem;">
          <div class="form-group">
            <label for="vet-staff">Vet Staff *</label>
            <input type="text" id="vet-staff" placeholder="Dr. Smith" required />
          </div>
          <div class="form-group">
            <label for="vet-notes">Additional Notes</label>
            <input type="text" id="vet-notes" placeholder="Any extra notes…" />
          </div>
        </div>
        <div class="form-submit-row">
          <button type="submit" class="btn-primary" style="width:100%;">Save Record</button>
        </div>
      </form>
    </div>

    <!-- Recent Records Panel -->
    <div class="staff-table-panel">
      <h2>📋 Recent Records</h2>
      <div class="table-wrapper">
        <table class="bookings-table">
          <thead>
            <tr><th>Pet</th><th>Owner</th><th>Diagnosis</th><th>Treatment</th><th>Vet</th><th>Vax Date</th><th>Date</th></tr>
          </thead>
          <tbody id="recent-records-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-brand"><span class="footer-logo">🐾 PawCare</span><span class="footer-tagline">Caring for your pets, always.</span></div>
</footer>

<script src="vet.js"></script>
<script src="nav-manager.js"></script>
</body>
</html>
